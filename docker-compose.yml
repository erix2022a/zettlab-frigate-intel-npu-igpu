# Zettlab D6 Ultra / Intel Core Ultra: Frigate on NPU + Ollama on iGPU
# Sample only. Copy .env.example to .env and set your own camera/MQTT details.
# Keep .env and frigate/config/ private (both are gitignored).

services:
  frigate:
    container_name: frigate
    image: ghcr.io/blakeblackshear/frigate:0.18.2
    restart: unless-stopped
    stop_grace_period: 30s
    shm_size: "512mb"
    devices:
      - /dev/accel:/dev/accel # Intel NPU; requires working host kernel/firmware
      - /dev/dri:/dev/dri     # Intel iGPU for hardware-accelerated video decode
    environment:
      FRIGATE_MQTT_HOST: "${FRIGATE_MQTT_HOST:?Set FRIGATE_MQTT_HOST in .env}"
      FRIGATE_MQTT_USER: "${FRIGATE_MQTT_USER:?Set FRIGATE_MQTT_USER in .env}"
      FRIGATE_MQTT_PASSWORD: "${FRIGATE_MQTT_PASSWORD:?Set FRIGATE_MQTT_PASSWORD in .env}"
      FRIGATE_CAMERA_RTSP_URL: "${FRIGATE_CAMERA_RTSP_URL:?Set FRIGATE_CAMERA_RTSP_URL in .env}"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./frigate/config:/config
      - ./frigate/media:/media/frigate
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 1000000000
    ports:
      - "8971:8971"       # Authenticated Frigate UI/API (HTTPS)
      - "8554:8554"       # RTSP restream (optional)
      - "8555:8555/tcp"   # WebRTC (optional)
      - "8555:8555/udp"
      # Never publish 5000 publicly: it is the unauthenticated internal API.

  ollama:
    container_name: ollama
    image: ollama/ollama:latest
    restart: unless-stopped
    mem_limit: "20g"
    devices:
      - /dev/dri:/dev/dri # Vulkan access to Intel Arc iGPU
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_VULKAN: "1"
      OLLAMA_IGPU_ENABLE: "1"
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_CONTEXT_LENGTH: "16384"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_MAX_QUEUE: "4"
    volumes:
      - ./ollama/data:/root/.ollama
    # Do not publish 11434: Ollama is reachable by Frigate on the Compose network.